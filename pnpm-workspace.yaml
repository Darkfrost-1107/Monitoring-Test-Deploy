packages:
  - 'apps/*'
  - 'packages/*'

minimumReleaseAge: 0

# CVE de dependencias transitivas que llegan a runtime del backend:
# - multer: DoS por nombres de campo anidados. La dep directa ya esta en 2.2.0,
#   pero @nestjs/core arrastra 2.1.1 por un peer viejo de platform-express.
# - js-yaml 4.x: consumo de CPU cuadratico; corre en el Swagger de /api/docs.
overrides:
  multer@<2.2.0: '^2.2.0'
  js-yaml@>=4.0.0 <4.3.1: '^4.3.1'

allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  esbuild: true
  msw: true
  prisma: true
  puppeteer: true
  unrs-resolver: true
