services:
  postgres:
    image: postgres:17
    container_name: monitoring-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: monitoring
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: monitoring-mailpit
    restart: always
    ports:
      - '1025:1025' # SMTP server
      - '8025:8025' # Web UI

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: monitoring-gotenberg
    restart: always
    ports:
      - '3001:3000'

volumes:
  postgres_data:
